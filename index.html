    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{
            min-height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            padding:30px;
            overflow-x:hidden;
            font-family:'Montserrat', sans-serif;
            background: linear-gradient(180deg, #4d2514 0%, #2a140d 45%, #140906 100%);
            position:relative;
        }
        body::before{

            position:absolute;
            inset:0;

            opacity:0.5;
            pointer-events: none;
        }
        body::after{
            content:"";
            position:absolute;
            width:900px;
            height:900px;
            border-radius:50%;
            background: radial-gradient(circle, rgba(255,180,120,0.18) 0%, rgba(255,120,60,0.08) 30%, transparent 70%);
            filter:blur(70px);
            z-index: 1;
            pointer-events: none;
        }
        .container{
            position:relative;
            z-index:2;
            width:100%;
            max-width:760px;
            padding:42px 36px;
            border-radius:34px;
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.03));

            border:1px solid rgba(255,255,255,0.08);
            box-shadow: 0 25px 60px rgba(0,0,0,0.45), inset 0 1px 0 rgba(255,255,255,0.08);
            text-align:center;
        }
        .logo{ width:150px; margin-bottom:26px; }
        .desc{ color:rgba(255,255,255,0.76); font-size:17px; line-height:1.7; margin-bottom:34px; }
        .card{
            width:100%;
            min-height:102px;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 30px;
            border-radius:30px;
            text-decoration:none;
            margin-bottom:22px;
            background: linear-gradient(145deg, rgba(0,0,0,0.18), rgba(255,255,255,0.04));
            border:1px solid rgba(255,255,255,0.08);
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.04), 0 10px 30px rgba(0,0,0,0.18);
            transition:0.28s;
        }
        .card:hover{
            transform:translateY(-5px);
            border-color:rgba(255,220,180,0.22);
            box-shadow: 0 18px 40px rgba(0,0,0,0.3), 0 0 25px rgba(255,170,100,0.08);
        }
        .left{ display:flex; align-items:center; gap:22px; }
        .icon-box{
            width:72px;
            height:72px;
            border-radius:24px;
            background: linear-gradient(145deg, rgba(255,220,180,0.12), rgba(255,255,255,0.03));
            display:flex;
            justify-content:center;
            align-items:center;
            box-shadow: inset 0 1px 0 rgba(255,255,255,0.08), 0 0 20px rgba(255,170,100,0.08);
        }
        .icon{ width:34px; height:34px; }
        .texts{ text-align:left; }
        .title{ color:#f7e7d6; font-size:27px; letter-spacing:1px; font-weight:500; }
        .sub{ margin-top:7px; color:rgba(255,255,255,0.58); font-size:14px; letter-spacing:2px; }
        .arrow{ font-size:52px; color:#f0c9a4; opacity:0.75; }
        .features{ margin-top:34px; display:flex; justify-content:space-between; gap:20px; flex-wrap:wrap; }
        .feature{ flex:1; min-width:180px; padding:18px; border-right:1px solid rgba(255,255,255,0.08); color:#f1d5ba; font-size:13px; }
        .feature:last-child{ border-right:none; }
        .footer{ margin-top:30px; color:rgba(255,255,255,0.42); font-size:13px; }

        @media (max-width:768px){

            .sub{ font-size:11px; letter-spacing:1px; }
