    <style>
        *{ margin:0; padding:0; box-sizing:border-box; }
        
        body{
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(180deg, #4d2514 0%, #2a140d 45%, #140906 100%);
        }

        /* Efeito de brilho de fundo */
        body::after{
            content: "";
            position: absolute;
            width: 80%;
            height: 60%;
            top: 20%;
            left: 10%;
            background: radial-gradient(circle, rgba(255,180,120,0.15) 0%, transparent 70%);
            filter: blur(60px);
            z-index: 1;
            pointer-events: none;
        }

        .container{
            position: relative;
            z-index: 2;
            width: 100%;
            max-width: 500px; /* Reduzi para ficar mais elegante */
            padding: 40px 25px;
            border-radius: 34px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            text-align: center;
        }

        .logo{ width: 130px; margin-bottom: 20px; }

        .desc{ 
            color: rgba(255, 255, 255, 0.8); 
            font-size: 16px; 
            line-height: 1.5; 
            margin-bottom: 30px; 
        }

        .card{
            width: 100%;
            min-height: 90px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 15px 20px;
            border-radius: 24px;
            text-decoration: none;
            margin-bottom: 16px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            transition: 0.3s;
        }

        .card:hover{
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.07);
            border-color: rgba(255, 220, 180, 0.3);
        }

        .left{ display: flex; align-items: center; gap: 15px; }

        .icon-box{
            width: 55px;
            height: 55px;
            border-radius: 18px;
            background: rgba(255, 220, 180, 0.1);
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .icon{ width: 28px; height: 28px; }

        .texts{ text-align: left; }

        .title{ color: #f7e7d6; font-size: 18px; font-weight: 500; }

        .sub{ margin-top: 4px; color: rgba(255, 255, 255, 0.5); font-size: 11px; letter-spacing: 1px; }

        .arrow{ font-size: 28px; color: #f0c9a4; opacity: 0.7; }

        .footer{ margin-top: 20px; color: rgba(255, 255, 255, 0.3); font-size: 12px; }

        /* AJUSTES MOBILE */
        @media (max-width: 480px){
            body {
                align-items: flex-start; /* Alinha no topo para não flutuar */
                padding: 40px 15px;
            }
            .container {
                padding: 30px 20px;
                border-radius: 28px;
            }
            .logo { width: 110px; }
            .title { font-size: 16px; }
            .card { min-height: 80px; margin-bottom: 12px; }
            .icon-box { width: 48px; height: 48px; border-radius: 14px; }
            .icon { width: 22px; height: 22px; }
        }
